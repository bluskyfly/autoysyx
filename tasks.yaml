# autoysyx tasks.yaml — single source of truth for the 44 work items.
# DO NOT modify after orchestrator has started running tasks; treat as immutable.

tasks:
  # ===== Phase 0: Bootstrap =====
  - id: PHASE0
    title: Bootstrap toolchain & ysyx-workbench clone
    stage: phase0
    deps: []
    estimated_minutes: 30
    doc_refs: []
    verification:
      type: env_lock_complete
      steps:
        - { cmd: "bash tools/check_env.sh", expect_exit: 0, expect_grep: ["env check OK"] }
        - { cmd: "test -d ysyx-workbench/nemu", expect_exit: 0 }
        - { cmd: "test -d ysyx-workbench/ysyxSoC", expect_exit: 0 }

  # ===== Stage F: 基础理论 =====
